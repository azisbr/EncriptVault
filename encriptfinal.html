<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encript Code & Media - Private Vault v9.0</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&family=Inter:wght@400;900&display=swap" rel="stylesheet">
    
    <script src="https://apis.google.com/js/api.js"></script>
    <script src="https://accounts.google.com/gsi/client"></script>

    <style>
        :root {
            --accent: #00d4ff;
            --bg: #030712;
            --card: rgba(6, 18, 45, 0.7);
            --border: rgba(0, 212, 255, 0.3);
            --glow: rgba(0, 212, 255, 0.6);
            --danger: #ff4757;
            --edit: #fbbf24;
            --success: #22c55e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: #e2e8f0; overflow-x: hidden; min-height: 100vh; }

        .bg-container { position: fixed; inset: 0; z-index: -1; background: radial-gradient(circle at 50% 50%, #06122d 0%, #030712 100%); }
        .grid-overlay { position: absolute; inset: 0; background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px); background-size: 50px 50px; opacity: 0.1; }

        @keyframes neonPulse { 0% { box-shadow: 0 0 5px var(--border); } 100% { box-shadow: 0 0 20px var(--glow); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        nav { padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; background: rgba(3, 7, 18, 0.8); backdrop-filter: blur(15px); border-bottom: 2px solid var(--accent); position: sticky; top: 0; z-index: 100; }
        .logo { font-family: 'Fira Code'; font-weight: 900; font-size: 1.2rem; color: #fff; }
        .logo span { color: var(--accent); text-shadow: 0 0 10px var(--glow); }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); z-index: 1000; display: none; place-items: center; padding: 20px; }
        .modal-box { background: var(--card); border: 2px solid var(--accent); border-radius: 15px; padding: 25px; width: 100%; max-width: 400px; animation: neonPulse 1.5s infinite alternate; }

        .page { display: none; width: 100%; max-width: 550px; margin: 0 auto; padding: 15px; animation: fadeIn 0.4s ease; }
        .page.active { display: block; }

        .instance-item { background: var(--card); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; display: flex; align-items: center; transition: 0.2s; }
        .instance-item:hover { border-color: var(--accent); transform: scale(1.01); }
        .instance-main { flex: 1; padding: 15px; font-weight: 700; display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .instance-del { padding: 15px; color: var(--danger); opacity: 0.5; cursor: pointer; }

        .code-card { background: rgba(13, 17, 23, 0.8); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; overflow: hidden; transition: 0.3s; position: relative; }
        .code-header { background: rgba(0, 212, 255, 0.05); padding: 10px 15px; font-size: 0.7rem; font-family: 'Fira Code'; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(0, 212, 255, 0.1); cursor: pointer; }
        
        .copy-btn { position: absolute; right: 10px; top: 45px; z-index: 10; color: var(--accent); cursor: pointer; opacity: 0; transition: 0.3s; padding: 5px; }
        .code-card.active .copy-btn { opacity: 0.6; }
        .copy-btn:hover { opacity: 1 !important; transform: scale(1.2); }

        .code-content { padding: 0 15px; font-family: 'Fira Code', monospace; font-size: 0.8rem; background: #000; color: var(--accent); white-space: pre-wrap; word-break: break-all; filter: blur(8px); user-select: none; transition: 0.4s, padding 0.4s; max-height: 0; opacity: 0; overflow-y: auto; }
        .code-card.active .code-content { filter: blur(0); user-select: text; max-height: 350px; padding: 20px 15px; opacity: 1; }

        .btn { background: var(--accent); color: #000; border: none; padding: 12px; border-radius: 6px; font-weight: 900; cursor: pointer; width: 100%; text-transform: uppercase; font-size: 0.8rem; transition: 0.3s;}
        .btn:hover { box-shadow: 0 0 15px var(--glow); }
        .btn:disabled { background: #555; color: #888; cursor: not-allowed; box-shadow: none; }
        
        input[type="text"], input[type="password"], textarea { width: 100%; padding: 12px; background: rgba(0,0,0,0.6); border: 1px solid var(--border); border-radius: 6px; color: #fff; margin-bottom: 12px; outline: none; font-size: 0.9rem; }

        .sidebar { position: fixed; top: 0; left: -100%; width: 260px; height: 100%; background: #030712; z-index: 200; border-right: 2px solid var(--accent); padding: 40px 20px; transition: 0.3s; }
        .sidebar.active { left: 0; }

        .action-bar { background: #000; padding: 8px 15px; display: flex; justify-content: flex-end; gap: 15px; border-top: 1px solid rgba(255,255,255,0.05); }
        .action-icon { cursor: pointer; font-size: 0.8rem; opacity: 0.6; transition: 0.3s; }
        .action-icon:hover { opacity: 1; }

        .file-drop-area { background: rgba(0,212,255,0.05); border: 1px dashed var(--accent); padding: 40px 20px; text-align: center; border-radius: 8px; margin-bottom: 15px; transition: 0.3s; }
        .file-drop-area:hover { background: rgba(0,212,255,0.1); }
        input[type="file"]::file-selector-button { background: var(--accent); color: #000; border: none; padding: 8px 15px; border-radius: 4px; font-weight: bold; cursor: pointer; margin-right: 15px; }
    </style>
</head>
<body>

    <div class="bg-container"><div class="grid-overlay"></div></div>

    <div id="modal-ui" class="modal-overlay">
        <div class="modal-box">
            <h3 id="modal-head" style="font-family:'Fira Code'; color:var(--accent); margin-bottom:10px;">PROMPT</h3>
            <p id="modal-desc" style="font-size:0.8rem; opacity:0.7; margin-bottom:15px;">Input required...</p>
            <input type="text" id="modal-input-single" placeholder="Name...">
            <textarea id="modal-input-area" placeholder="Paste data..." rows="10"></textarea>
            <div id="modal-actions" style="display: flex; gap: 8px;">
                <button class="btn" id="modal-ok">OK</button>
                <button class="btn" id="modal-cancel" onclick="closeModal()" style="background:transparent; color:var(--accent); border:1px solid var(--accent);">EXIT</button>
            </div>
        </div>
    </div>

    <nav>
        <i class="fas fa-bars" onclick="toggleSidebar()" style="cursor:pointer; color: var(--accent); font-size: 1.2rem;"></i>
        <div class="logo">Encript<span>VAULT</span></div>
        <div id="nav-user" style="display:none"><i class="fas fa-user-shield"></i></div>
    </nav>

    <div id="sidebar" class="sidebar">
        <i class="fas fa-times" onclick="toggleSidebar()" style="margin-bottom:40px; cursor:pointer; color:var(--accent); font-size: 1.5rem;"></i>
        
        <div onclick="showPage('dashboard'); toggleSidebar()" style="color:#fff; font-size:1rem; margin-bottom:25px; cursor:pointer; font-weight: bold;"><i class="fas fa-file-code" style="width: 25px;"></i> TEXT VAULT</div>
        <div onclick="showPage('media-vault'); toggleSidebar()" style="color:#fff; font-size:1rem; margin-bottom:50px; cursor:pointer; font-weight: bold;"><i class="fas fa-cloud-upload-alt" style="width: 25px;"></i> MEDIA DRIVE</div>

        <div onclick="logout()" style="color:var(--danger); font-size:1rem; cursor:pointer; font-weight: bold;"><i class="fas fa-power-off" style="width: 25px;"></i> SYSTEM LOGOUT</div>
    </div>

    <div id="landing" class="page active" style="text-align:center; padding-top:100px">
        <h1 id="type-target" style="font-size: 2.2rem; font-family:'Fira Code'; margin-bottom:10px;"></h1>
        <p style="opacity:0.5; font-size:0.7rem; letter-spacing:2px; margin-bottom:40px;">SECURE DATA TERMINAL</p>
        <button class="btn" onclick="showPage('login')" style="max-width:200px">ACCESS VAULT</button>
    </div>

    <div id="login" class="page">
        <div class="modal-box" style="max-width:100%; border-width:1px;">
            <h2 style="color:var(--accent); margin-bottom:15px; font-size:1.2rem;">AUTHENTICATION</h2>
            <input type="text" id="login-user" placeholder="USER_ID">
            <input type="password" id="login-pass" placeholder="ACCESS_KEY">
            <button class="btn" onclick="doLogin()">LOGIN</button>
            <p style="text-align:center; margin-top:15px; font-size:10px; opacity:0.4; cursor:pointer" onclick="showPage('register')">> REGISTER NEW ID</p>
        </div>
    </div>

    <div id="register" class="page">
        <div class="modal-box" style="max-width:100%; border-width:1px;">
            <h2 style="color:var(--accent); margin-bottom:15px; font-size:1.2rem;">REGISTRATION</h2>
            <input type="text" id="reg-user" placeholder="NEW_ID">
            <input type="password" id="reg-pass" placeholder="NEW_KEY">
            <button class="btn" onclick="doRegister()">CREATE</button>
        </div>
    </div>

    <div id="dashboard" class="page">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h2 style="font-size:0.9rem; font-family:'Fira Code'; opacity:0.6;">VAULTS_LIST [TEXT]</h2>
            <button class="btn" onclick="triggerNewFolder()" style="width:auto; padding:5px 12px; font-size:0.6rem;">+ NEW FOLDER</button>
        </div>
        <div id="instance-list"></div>
    </div>

    <div id="folder-view" class="page">
        <div style="display:flex; align-items:center; gap:12px; margin-bottom:20px">
            <i class="fas fa-arrow-left" onclick="showPage('dashboard')" style="cursor:pointer; color: var(--accent); font-size: 1.2rem;"></i>
            <h3 id="active-title" style="font-family:'Fira Code'; font-size:1rem;"></h3>
        </div>
        <button class="btn" onclick="triggerNewNote()" style="margin-bottom:15px; background:#fff; color:#000;">+ DEPLOY_BLOCK</button>
        <div id="note-list"></div>
    </div>

    <div id="media-vault" class="page">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h2 style="font-size:0.9rem; font-family:'Fira Code'; opacity:0.6;">MEDIA_DRIVE_UPLINK</h2>
        </div>
        
        <div class="modal-box" style="max-width:100%; border-width:1px;">
            <p style="font-size: 0.75rem; margin-bottom: 20px; opacity: 0.7; font-family:'Fira Code'; text-align: center;">ESTABLISH CONNECTION TO GOOGLE DRIVE</p>
            
            <button class="btn" id="btn-auth-google" onclick="handleAuthClick()" style="background: #fff; color: #000; margin-bottom: 20px;">
                <i class="fab fa-google"></i> AUTHENTICATE GOOGLE ACCOUNT
            </button>

            <div id="upload-section" style="display: none; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px;">
                <div class="file-drop-area">
                    <input type="file" id="media-file" accept="image/*,video/*">
                </div>
                <button class="btn" id="btn-upload" onclick="uploadFile()"><i class="fas fa-upload"></i> INITIATE UPLOAD</button>
                <p id="upload-status" style="font-size: 0.75rem; color: var(--accent); margin-top: 15px; font-family:'Fira Code'; text-align:center; font-weight:bold;"></p>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // KONFIGURASI GOOGLE DRIVE API
        // ==========================================
        const CLIENT_ID = '337315971224-dcpr64gncthv4m2h28joraebjvvdqfcm.apps.googleusercontent.com'; // Sudah diisi dengan Client ID asli Anda
        const SCOPES = 'https://www.googleapis.com/auth/drive.file';
        
        let tokenClient;
        let accessToken = null;

        function gisLoaded() {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: SCOPES,
                callback: (tokenResponse) => {
                    if (tokenResponse && tokenResponse.access_token) {
                        accessToken = tokenResponse.access_token;
                        document.getElementById('btn-auth-google').innerHTML = "<i class='fas fa-check'></i> CONNECTION SECURED";
                        document.getElementById('btn-auth-google').style.background = "var(--success)";
                        document.getElementById('btn-auth-google').style.color = "#fff";
                        document.getElementById('upload-section').style.display = "block";
                    }
                },
            });
        }
        window.onload = () => { gisLoaded(); typeWriter(); };

        function handleAuthClick() {
            tokenClient.requestAccessToken({prompt: 'consent'});
        }

        async function uploadFile() {
            const fileInput = document.getElementById('media-file');
            const statusText = document.getElementById('upload-status');
            const btnUpload = document.getElementById('btn-upload');

            if (!fileInput.files || fileInput.files.length === 0) {
                statusText.style.color = "var(--danger)";
                statusText.innerText = "ERROR: NO FILE SELECTED.";
                return;
            }

            const file = fileInput.files[0];
            statusText.style.color = "var(--edit)";
            statusText.innerText = `[UPLOADING] ${file.name} ... PLEASE WAIT.`;
            btnUpload.disabled = true;

            const metadata = { name: file.name, mimeType: file.type };
            const form = new FormData();
            form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
            form.append('file', file);

            try {
                const response = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
                    method: 'POST',
                    headers: new Headers({ 'Authorization': 'Bearer ' + accessToken }),
                    body: form
                });

                const result = await response.json();
                
                if (response.ok) {
                    statusText.style.color = "var(--success)";
                    statusText.innerText = `[SUCCESS] FILE SECURED IN DRIVE!`;
                    fileInput.value = ''; 
                } else {
                    statusText.style.color = "var(--danger)";
                    statusText.innerText = `[ERROR] ${result.error.message}`;
                }
            } catch (error) {
                statusText.style.color = "var(--danger)";
                statusText.innerText = `[NETWORK ERROR] UPLOAD FAILED.`;
            } finally {
                btnUpload.disabled = false;
            }
        }

        // ==========================================
        // LOGIKA APLIKASI TEKS ASLI
        // ==========================================
        let usersAuth = JSON.parse(localStorage.getItem('zp_users_auth')) || { "admin": "123" };
        let currentUser = null;
        let currentUserVault = [];
        let folderIdx = null;

        function escapeHTML(str) { return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

        const textToType = "EncriptVault.";
        let charIdx = 0;
        function typeWriter() {
            if (charIdx < textToType.length) {
                document.getElementById("type-target").innerHTML += textToType.charAt(charIdx);
                charIdx++;
                setTimeout(typeWriter, 120);
            }
        }

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(id === 'dashboard') renderFolders();
        }

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('active'); }
        function closeModal() { document.getElementById('modal-ui').style.display = 'none'; }

        function showCustomModal(title, desc, type, callback, initialVal = '') {
            const modal = document.getElementById('modal-ui');
            const inputS = document.getElementById('modal-input-single');
            const inputA = document.getElementById('modal-input-area');
            const btnOk = document.getElementById('modal-ok');
            
            modal.style.display = 'grid';
            document.getElementById('modal-head').innerText = title;
            document.getElementById('modal-desc').innerText = desc;
            
            inputS.style.display = type === 'input-single' ? 'block' : 'none';
            inputA.style.display = type === 'input-area' ? 'block' : 'none';
            
            if(type === 'input-area') inputA.value = initialVal;
            if(type === 'input-single') inputS.value = initialVal;

            if(type === 'confirm') { btnOk.style.background = 'var(--danger)'; btnOk.innerText = 'CONFIRM'; } 
            else if (type === 'alert-danger') { btnOk.style.background = 'var(--danger)'; btnOk.innerText = 'RETRY'; } 
            else { btnOk.style.background = 'var(--accent)'; btnOk.innerText = 'EXECUTE'; }

            btnOk.onclick = () => {
                let val = (type === 'input-area') ? inputA.value : (type === 'input-single' ? inputS.value : true);
                callback(val);
                closeModal();
                inputA.value = ''; inputS.value = '';
            };
        }

        function doLogin() {
            const u = document.getElementById('login-user').value;
            const p = document.getElementById('login-pass').value;
            if(usersAuth[u] === p) {
                currentUser = u;
                currentUserVault = JSON.parse(localStorage.getItem('vault_' + u)) || [];
                document.getElementById('nav-user').style.display = 'block';
                showPage('dashboard');
            } else { showCustomModal('AUTH_FAILED', 'ACCESS_DENIED: Unauthorized credentials.', 'alert-danger', () => {} ); }
        }

        function doRegister() {
            const u = document.getElementById('reg-user').value;
            const p = document.getElementById('reg-pass').value;
            if(!u || !p) return;
            usersAuth[u] = p;
            localStorage.setItem('zp_users_auth', JSON.stringify(usersAuth));
            showPage('login');
        }

        function triggerNewFolder() {
            showCustomModal('NEW_VAULT', 'Assign name:', 'input-single', (val) => {
                if(!val) return;
                currentUserVault.push({name: val, notes: []});
                save(); renderFolders();
            });
        }

        function renderFolders() {
            const list = document.getElementById('instance-list');
            list.innerHTML = '';
            currentUserVault.forEach((f, i) => {
                const div = document.createElement('div');
                div.className = 'instance-item';
                div.innerHTML = `<div class="instance-main" onclick="enterFolder(${i})"><i class="fas fa-lock"></i> ${f.name.toUpperCase()}</div>
                                 <div class="instance-del" onclick="confirmDelFolder(${i})"><i class="fas fa-trash"></i></div>`;
                list.appendChild(div);
            });
        }

        function enterFolder(i) {
            folderIdx = i;
            document.getElementById('active-title').innerText = `> ${currentUserVault[i].name}`;
            renderNotes();
            showPage('folder-view');
        }

        function triggerNewNote() {
            showCustomModal('NEW_BLOCK', 'Input code/data:', 'input-area', (val) => {
                if(!val) return;
                currentUserVault[folderIdx].notes.push(val);
                save(); renderNotes();
            });
        }

        function renderNotes() {
            const list = document.getElementById('note-list');
            list.innerHTML = '';
            currentUserVault[folderIdx].notes.forEach((n, i) => {
                const card = document.createElement('div');
                card.className = 'code-card';
                card.innerHTML = `
                    <div class="code-header" onclick="this.parentElement.classList.toggle('active')">
                        <span>BLOCK_0${i+1} [ENCRYPTED]</span>
                        <i class="fas fa-eye"></i>
                    </div>
                    <div class="copy-btn" onclick="copyText('${escapeHTML(n)}', this)"><i class="fas fa-copy"></i></div>
                    <div class="code-content">${escapeHTML(n)}</div>
                    <div class="action-bar">
                         <i class="fas fa-pencil action-icon" style="color:var(--edit)" onclick="editNote(${i})"></i>
                         <i class="fas fa-trash action-icon" style="color:var(--danger)" onclick="confirmDelNote(${i})"></i>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        function copyText(text, btn) {
            navigator.clipboard.writeText(text).then(() => {
                const icon = btn.querySelector('i');
                icon.className = 'fas fa-check';
                btn.style.color = '#22c55e';
                setTimeout(() => { icon.className = 'fas fa-copy'; btn.style.color = 'var(--accent)'; }, 1500);
            });
        }

        function editNote(i) {
            const currentText = currentUserVault[folderIdx].notes[i];
            showCustomModal('EDIT_BLOCK', 'Update code/data:', 'input-area', (newVal) => {
                if(!newVal) return;
                currentUserVault[folderIdx].notes[i] = newVal;
                save(); renderNotes();
            }, currentText);
        }

        function confirmDelFolder(i) { showCustomModal('CRITICAL_WARNING', `Delete vault "${currentUserVault[i].name}"?`, 'confirm', (ok) => { if(ok) { currentUserVault.splice(i,1); save(); renderFolders(); } }); }
        function confirmDelNote(i) { showCustomModal('WARNING', `Delete block permanent?`, 'confirm', (ok) => { if(ok) { currentUserVault[folderIdx].notes.splice(i,1); save(); renderNotes(); } }); }
        function save() { localStorage.setItem('vault_' + currentUser, JSON.stringify(currentUserVault)); }
        function logout() { location.reload(); }
    </script>
</body>
</html>
